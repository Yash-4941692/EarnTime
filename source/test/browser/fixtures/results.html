<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>jee - YouTube</title></head>
  <body>
    <ytd-app>
      <div id="contents">
        <ytd-video-renderer id="study-video">
          <div id="channel-info"><ytd-channel-name><div id="text"><a href="/@pwlive">PW Live</a></div></ytd-channel-name></div>
          <a id="video-title" href="/watch?v=study1">JEE Physics lecture</a>
        </ytd-video-renderer>
        <ytd-video-renderer id="random-video">
          <div id="channel-info"><ytd-channel-name><div id="text"><a href="/@vlogs">Random Vlogs</a></div></ytd-channel-name></div>
          <a id="video-title" href="/watch?v=vlog1">Funny video</a>
        </ytd-video-renderer>
        <ytd-video-renderer id="nameless-video">
          <a id="video-title" href="/watch?v=nameless">No channel shown</a>
        </ytd-video-renderer>
        <ytd-reel-shelf-renderer id="shorts-shelf">
          <ytd-reel-item-renderer><a id="shorts-link" href="/shorts/study-short">JEE study Short</a></ytd-reel-item-renderer>
        </ytd-reel-shelf-renderer>
        <ytd-rich-shelf-renderer>
          <ytm-shorts-lockup-view-model><a id="modern-shorts-link" href="/shorts/study-short">Another study Short</a></ytm-shorts-lockup-view-model>
        </ytd-rich-shelf-renderer>
      </div>
    </ytd-app>
  </body>
</html>
